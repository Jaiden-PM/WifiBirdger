name: Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate version
        id: version
        shell: bash
        run: |
          VERSION="1.3.${{ github.run_number }}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          echo "Building version $VERSION"

      - name: Build Windows x64
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          GOOS=windows \
          GOARCH=amd64 \
          CGO_ENABLED=0 \
          go build \
            -trimpath \
            -ldflags="-s -w -H=windowsgui -X main.currentVersion=$VERSION" \
            -o WiFiEthernetBridge.exe .

      - name: Generate SHA256
        run: |
          sha256sum WiFiEthernetBridge.exe > WiFiEthernetBridge.exe.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WifiBirdger ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            WiFiEthernetBridge.exe
            WiFiEthernetBridge.exe.sha256
